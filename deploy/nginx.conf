# Пример конфигурации nginx для VPS (сайт на Node.js за nginx)
# Замените ваш-домен.ru и пути. SSL удобно получить через certbot: certbot --nginx -d ваш-домен.ru
server {
    listen 80;
    server_name ваш-домен.ru www.ваш-домен.ru;
    return 301 https://ваш-домен.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name ваш-домен.ru;
    # ssl_certificate     /etc/letsencrypt/live/ваш-домен.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ваш-домен.ru/privkey.pem;

    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
